<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000元至尊版生日电子贺卡</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    background: #0a0a20;
    color: #fff;
  }

  /* 粒子背景 */
  canvas#bgCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  /* 中心祝福文字 */
  #mainText {
    position: absolute;
    top: 30%;
    width: 100%;
    text-align: center;
    font-size: 3em;
    color: #ff6b81;
    text-shadow: 0 0 20px #ff6b81;
    animation: fadeIn 3s ease-in-out forwards;
  }

  @keyframes fadeIn {
    0% { opacity: 0; transform: scale(0.8);}
    100% { opacity: 1; transform: scale(1);}
  }

  /* 照片墙 */
  #photoWall {
    position: absolute;
    bottom: 5%;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 15px;
    overflow-x: auto;
    padding: 10px;
  }

  #photoWall img {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 0 10px #ff6b81;
    transition: transform 0.3s;
    cursor: pointer;
  }

  #photoWall img:hover {
    transform: scale(1.2);
  }

  /* 背景音乐 */
  #bgMusic {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    cursor: pointer;
    z-index: 10;
  }

  #bgMusic.playing {
    animation: rotate 2s linear infinite;
  }

  @keyframes rotate {
    from { transform: rotate(0deg);}
    to { transform: rotate(360deg);}
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="mainText">生日快乐！</div>

<div id="photoWall">
  <img src="https://picsum.photos/id/1011/100/100" alt="Photo1">
  <img src="https://picsum.photos/id/1012/100/100" alt="Photo2">
  <img src="https://picsum.photos/id/1013/100/100" alt="Photo3">
  <img src="https://picsum.photos/id/1015/100/100" alt="Photo4">
  <img src="https://picsum.photos/id/1016/100/100" alt="Photo5">
</div>

<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0; i<150; i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*3 + 1,
    dx: (Math.random()-0.5)*1.5,
    dy: (Math.random()-0.5)*1.5,
    color: 'rgba(255,255,255,' + Math.random()+')'
  });
}

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,2*Math.PI);
    ctx.fillStyle = p.color;
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0 || p.x>canvas.width) p.dx*=-1;
    if(p.y<0 || p.y>canvas.height) p.dy*=-1;
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

// 背景音乐点击控制
const music = document.getElementById('bgMusic');
music.addEventListener('click', ()=>{
  if(music.paused){
    music.play();
    music.classList.add('playing');
  } else {
    music.pause();
    music.classList.remove('playing');
  }
});
music.classList.add('playing');

// 照片墙滚动效果（自动轮播）
const photoWall = document.getElementById('photoWall');
let scrollPos = 0;
function autoScroll(){
  scrollPos += 0.5;
  if(scrollPos > photoWall.scrollWidth - photoWall.clientWidth) scrollPos = 0;
  photoWall.scrollLeft = scrollPos;
  requestAnimationFrame(autoScroll);
}
autoScroll();

<script>
// ==========================
// 烟花动画
// ==========================
class Firework {
    constructor(x, y, color){
        this.x = x;
        this.y = y;
        this.particles = [];
        this.color = color || `hsl(${Math.random()*360}, 100%, 50%)`;
        for(let i=0;i<50;i++){
            this.particles.push({
                x: this.x,
                y: this.y,
                dx: (Math.random()-0.5)*6,
                dy: (Math.random()-0.5)*6,
                alpha: 1,
                size: Math.random()*2+1
            });
        }
    }
    update(){
        for(let p of this.particles){
            p.x += p.dx;
            p.y += p.dy;
            p.alpha -= 0.02;
        }
        this.particles = this.particles.filter(p=>p.alpha>0);
    }
    draw(ctx){
        for(let p of this.particles){
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.size,0,2*Math.PI);
            ctx.fillStyle = `hsla(${Math.random()*360},100%,50%,${p.alpha})`;
            ctx.fill();
        }
    }
}

let fireworks = [];
function launchFirework(){
    fireworks.push(new Firework(Math.random()*canvas.width, Math.random()*canvas.height/2));
}
setInterval(launchFirework, 1000);

function animateFireworks(){
    requestAnimationFrame(animateFireworks);
    // 不清空canvas, 保留粒子残影
    ctx.fillStyle = 'rgba(10,10,20,0.2)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let f of fireworks){
        f.update();
        f.draw(ctx);
    }
    fireworks = fireworks.filter(f=>f.particles.length>0);
}
animateFireworks();

// ==========================
// 3D 粒子心形
// ==========================
let heartParticles = [];
function createHeartParticles(){
    heartParticles = [];
    let cx = canvas.width/2, cy = canvas.height/2;
    for(let i=0;i<200;i++){
        let t = Math.random()*2*Math.PI;
        let r = 16*Math.pow(Math.sin(t),3);
        let y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
        heartParticles.push({
            x: cx + r*12 + (Math.random()-0.5)*10,
            y: cy + y*12 + (Math.random()-0.5)*10,
            dx: 0,
            dy: 0.5 + Math.random()*1,
            size: Math.random()*2+1,
            color: `hsl(${Math.random()*360}, 100%, 60%)`
        });
    }
}
createHeartParticles();

function animateHeartParticles(){
    requestAnimationFrame(animateHeartParticles);
    // 半透明覆盖保留残影
    ctx.fillStyle = 'rgba(10,10,20,0.15)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let p of heartParticles){
        p.y += p.dy;
        if(p.y > canvas.height) p.y = canvas.height/2;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,2*Math.PI);
        ctx.fillStyle = p.color;
        ctx.fill();
    }
}
animateHeartParticles();

// ==========================
// 流星雨效果
// ==========================
let meteors = [];
function createMeteor(){
    meteors.push({
        x: Math.random()*canvas.width,
        y: -10,
        dx: Math.random()*3+2,
        dy: Math.random()*5+2,
        length: Math.random()*80+50
    });
}
setInterval(createMeteor, 500);

function animateMeteors(){
    requestAnimationFrame(animateMeteors);
    ctx.fillStyle = 'rgba(10,10,20,0.1)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let m of meteors){
        ctx.beginPath();
        ctx.moveTo(m.x,m.y);
        ctx.lineTo(m.x - m.dx*5, m.y - m.dy*5);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 2;
        ctx.stroke();
        m.x += m.dx;
        m.y += m.dy;
    }
    meteors = meteors.filter(m=>m.y < canvas.height + m.length);
}
animateMeteors();

// ==========================
// 打字机情书效果
// ==========================
const messageEl = document.createElement('div');
messageEl.style.position = 'absolute';
messageEl.style.top = '45%';
messageEl.style.width = '100%';
messageEl.style.textAlign = 'center';
messageEl.style.fontSize = '2em';
messageEl.style.color = '#fff';
messageEl.style.textShadow = '0 0 10px #ff6b81';
document.body.appendChild(messageEl);

let messages = [
    "亲爱的，生日快乐！🎂",
    "愿你的每一天都充满欢笑和幸福💖",
    "这一刻的美好将永远珍藏✨"
];
let msgIndex = 0, charIndex = 0;

function typeMessage(){
    if(msgIndex >= messages.length) return;
    messageEl.innerHTML = messages[msgIndex].substring(0,charIndex) + '<span style="opacity:0.8">|</span>';
    charIndex++;
    if(charIndex > messages[msgIndex].length){
        charIndex = 0;
        msgIndex++;
        setTimeout(typeMessage, 1000);
    } else {
        setTimeout(typeMessage, 100);
    }
}
typeMessage();
</script>
</script>

</body>
</html>
