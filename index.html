<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000元至尊版生日电子贺卡</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
    background: #0a0a20;
    color: #fff;
  }

  /* 粒子背景 */
  canvas#bgCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }

  /* 中心祝福文字 */
  #mainText {
    position: absolute;
    top: 30%;
    width: 100%;
    text-align: center;
    font-size: 3em;
    color: #ff6b81;
    text-shadow: 0 0 20px #ff6b81;
    animation: fadeIn 3s ease-in-out forwards;
  }

  @keyframes fadeIn {
    0% { opacity: 0; transform: scale(0.8);}
    100% { opacity: 1; transform: scale(1);}
  }

  /* 照片墙 */
  #photoWall {
    position: absolute;
    bottom: 5%;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 15px;
    overflow-x: auto;
    padding: 10px;
  }

  #photoWall img {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
    box-shadow: 0 0 10px #ff6b81;
    transition: transform 0.3s;
    cursor: pointer;
  }

  #photoWall img:hover {
    transform: scale(1.2);
  }

  /* 背景音乐 */
  #bgMusic {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 50px;
    height: 50px;
    cursor: pointer;
    z-index: 10;
  }

  #bgMusic.playing {
    animation: rotate 2s linear infinite;
  }

  @keyframes rotate {
    from { transform: rotate(0deg);}
    to { transform: rotate(360deg);}
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="mainText">生日快乐！</div>

<div id="photoWall">
  <img src="https://picsum.photos/id/1011/100/100" alt="Photo1">
  <img src="https://picsum.photos/id/1012/100/100" alt="Photo2">
  <img src="https://picsum.photos/id/1013/100/100" alt="Photo3">
  <img src="https://picsum.photos/id/1015/100/100" alt="Photo4">
  <img src="https://picsum.photos/id/1016/100/100" alt="Photo5">
</div>

<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0; i<150; i++){
  particles.push({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*3 + 1,
    dx: (Math.random()-0.5)*1.5,
    dy: (Math.random()-0.5)*1.5,
    color: 'rgba(255,255,255,' + Math.random()+')'
  });
}

function drawParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,2*Math.PI);
    ctx.fillStyle = p.color;
    ctx.fill();

    p.x += p.dx;
    p.y += p.dy;

    if(p.x<0 || p.x>canvas.width) p.dx*=-1;
    if(p.y<0 || p.y>canvas.height) p.dy*=-1;
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

// 背景音乐点击控制
const music = document.getElementById('bgMusic');
music.addEventListener('click', ()=>{
  if(music.paused){
    music.play();
    music.classList.add('playing');
  } else {
    music.pause();
    music.classList.remove('playing');
  }
});
music.classList.add('playing');

// 照片墙滚动效果（自动轮播）
const photoWall = document.getElementById('photoWall');
let scrollPos = 0;
function autoScroll(){
  scrollPos += 0.5;
  if(scrollPos > photoWall.scrollWidth - photoWall.clientWidth) scrollPos = 0;
  photoWall.scrollLeft = scrollPos;
  requestAnimationFrame(autoScroll);
}
autoScroll();
</script>

</body>
</html>
