<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>生日快乐</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
font-family:sans-serif;
overflow:hidden;
}

.card{
width:90%;
max-width:400px;
padding:30px;
border-radius:25px;
text-align:center;

background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);

box-shadow:0 8px 30px rgba(0,0,0,.15);
}

h1{
color:white;
font-size:36px;
margin-bottom:15px;
}

.message{
color:white;
font-size:18px;
line-height:1.8;
min-height:100px;
}

button{
margin-top:20px;
padding:12px 24px;
border:none;
border-radius:30px;
background:white;
font-size:18px;
cursor:pointer;
}

.heart{
position:fixed;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100px);
opacity:1;
}

100%{
transform:translateY(110vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<h1>🎂生日快乐</h1>

<div class="slider">
<img id="photo"
src="https://picsum.photos/400/300"
width="100%">
</div>

<div class="message" id="typing"></div>

<button onclick="showGift()">
点击领取惊喜
</button>

</div>

<script>

const text=
"愿你新的一岁平安喜乐，万事胜意，所有美好都如约而至。";

let i=0;

function typeWriter(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(typeWriter,120);

}

}

typeWriter();

function showGift(){

alert("🎁 今天开始好运加倍！");

}

for(let i=0;i<40;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=
(5+Math.random()*5)+"s";

heart.style.fontSize=
(15+Math.random()*20)+"px";

document.body.appendChild(heart);

}

</script>

</body>
</html>
