<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日祝福</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    background: linear-gradient(to top, #ffecd2 0%, #fcb69f 100%);
  }
  #slideshow {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }
  #slideshow img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  #slideshow img.active {
    opacity: 1;
  }
  #loveLetter {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    text-align: center;
    color: #fff;
    font-size: 2em;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    animation: fadeIn 2s ease-in-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- 背景音乐 -->
<audio id="bgm" src="music.mp3" autoplay loop></audio>

<!-- 照片轮播 -->
<div id="slideshow">
  <img src="photo1.jpg" class="active">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
</div>

<!-- 情书动画 -->
<div id="loveLetter">🎂 生日快乐！愿所有美好都奔向你！</div>

<!-- 烟花动画 -->
<canvas id="fireworks"></canvas>

<script>
// 照片轮播
const slides = document.querySelectorAll('#slideshow img');
let current = 0;
setInterval(() => {
  slides[current].classList.remove('active');
  current = (current + 1) % slides.length;
  slides[current].classList.add('active');
}, 4000);

// 烟花动画
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.vel = { x: (Math.random()-0.5)*6, y: Math.random()*-8 };
    this.alpha = 1;
    this.size = Math.random()*3 + 2;
  }
  update() {
    this.x += this.vel.x;
    this.y += this.vel.y;
    this.vel.y += 0.15; // gravity
    this.alpha -= 0.015;
  }
  draw() {
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let particles = [];

function fireworks() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(Math.random() < 0.03) {
    let x = Math.random()*canvas.width;
    let y = Math.random()*canvas.height/2;
    let color = `hsl(${Math.random()*360}, 100%, 50%)`;
    for(let i=0;i<30;i++){
      particles.push(new Particle(x, y, color));
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    particles[i].update();
    particles[i].draw();
    if(particles[i].alpha <= 0) particles.splice(i,1);
  }
  requestAnimationFrame(fireworks);
}
fireworks();

// 手机浏览器自动播放
document.getElementById('bgm').play().catch(()=>{});
</script>

</body>
</html>
